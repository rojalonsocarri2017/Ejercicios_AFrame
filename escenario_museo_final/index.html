<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="description" content="Habitación interactiva con A-Frame">
    <title>Museo en Realidad Virtual</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.4/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>
    <script src="components/star-sky.js"></script>
    <script src="art-gallery.js"></script>
    <script src="figure.js"></script>
    <script src="components/aframe-lounge.js"></script>
    <script src="components/distance.js"></script>
    <script src="components/time.js"></script>
    
  </head>
  <body>
      <a-scene antialias: true; logarithmicDepthBuffer: true; colorManagement: true; sortObjects: true;>
      <a-assets>
          <a-asset-item id="model1" src="assets/car.glb"></a-asset-item>  
          <a-asset-item id="model2" src="assets/elephant.glb"></a-asset-item>
          <a-asset-item id="model3" src="assets/skull.glb"></a-asset-item>
          <audio id="sound1" crossorigin="anonymous" src="sounds/sound1.mp3"></audio>
          <audio id="sound2" crossorigin="anonymous" src="sounds/sound2.mp3"></audio>
          <video id="movie1" crossorigin="anonymous" src="movies/movie1.mp4"></video>
      </a-assets>

      <!-- Iluminación -->
      <a-entity id="room-light" light="color: #ffffff; type: ambient; intensity: 0.85"></a-entity>

      <a-entity id="lounge" position="5 0 0" position="0 0 0" lounge="width: 30; depth: 80; height: 10; ceiling: true; north: barrier; east: glass; south: wall; floorTexture: assets/floor-texture.jpg; wallTexture: assets/wall.jpg; ceilingTexture: assets/wall.jpg">

      <a-entity position="0 0 0" art-gallery="figures: #model1, #model2, #model3; names: Escultura 1, Escultura 2, Escultura 3">
          <!-- <a-entity figure="figure: #model1; name: Escultura 1; description: Descripcion de la escultura 1; scale: 1.2 1.2 1.2; text-scale: 7 7 7; text-position: 0 1.3 0; position= 3 0 20"   rotation="0 250 0" lounge-staydown></a-entity> -->
          <!-- <a-entity figure="figure: #model2; name: Escultura 2; description: Descripcion de la escultura 2; scale: 2 2 2; text-scale: 25 25 25; text-position: 0 6 0; position= -15.737 -2 5.511" distance="camera: #camera1; distanceLimit: 20" ></a-entity> -->
          <!-- <a-entity figure="figure: #model2; name: Escultura 2; description: Descripcion de la escultura 2; scale: 2 2 2; text-scale: 25 25 25; text-position: 0 6 0; position= 3 0 20" distance="camera: #camera1; distanceLimit: 20"  lounge-staydown></a-entity>
            -->
            <a-entity figure="figure: #model1; name: Escultura 1; description: Descripcion de la escultura 1; scale: 1.2 1.2 1.2; text-scale: 7 7 7; text-position: 0 1.3 0; position: 0 0 3" rotation="0 250 0" lounge-staydown></a-entity>

            <a-entity figure="figure: #model2; name: Escultura 2; description: Descripcion de la escultura 2; scale: 2 2 2; text-scale: 25 25 25; text-position: 0 6 0; position: -15.737 0 15" distance="camera: #camera1; distanceLimit: 20" lounge-staydown></a-entity>
            
            <a-entity lounge-plinth="width: 2; depth: 2; height: 3; color: #808080" position="-5 0 30" lounge-staydown="offsetY: 1.5">
              <a-entity figure="figure: #model3; name: Escultura 3; description: Descripcion de la escultura 3; scale: 1 1 1; text-scale: 55 55 55; text-position: 0 9 0;" position="0 -10 0" rotation="0 90 0" ></a-entity>
            </a-entity>
            <!-- <a-entity figure="figure: #model3; name: Escultura 3; description: Descripcion de la escultura 3; scale: 2 2 2; text-scale: 55 55 55; text-position: 0 9 0; position: -5 0 30" rotation="0 90 0" lounge-plinth="width: 2; depth: 2; height: 3" animation="property: object3D.rotation.y; to: 360; dur: 5000; loop: true; easing: linear" lounge-staydown="offsetY: 1.5"></a-entity> -->
      </a-entity>

      <a-entity hand-tracking-controls="hand: left"></a-entity>
      <a-entity hand-tracking-controls="hand: right"></a-entity>
      <a-entity lounge-entry-point>
          <a-entity id="camera1" camera position="0 2 10" look-controls
                    wasd-controls="fly: false">
          </a-entity>
      </a-entity>
      <a-sky color="black"></a-sky>
      <a-entity star-sky></a-entity>
      
    </a-scene>
  </body>
</html>
